name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values only — every route is dynamic (reads cookies/headers),
          # so the build never needs to reach a live database or external API.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-a-real-secret-0000
          BETTER_AUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real-0000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          TMDB_ACCESS_TOKEN: ci-placeholder-tmdb-token-not-real-0000
