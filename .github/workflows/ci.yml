name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Both majors the engines range admits — Vercel may pick either, so CI
      # must prove the one it deploys, not just the one developed on.
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values only — every route is dynamic (reads cookies/headers),
          # so the build never needs to reach a live database or external API.
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-a-real-secret-0000
          BETTER_AUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real-0000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          TMDB_ACCESS_TOKEN: ci-placeholder-tmdb-token-not-real-0000

  # Fails when prisma/migrations and schema.prisma disagree, e.g. a schema edit
  # without its migration or a hand-edited migration. Replays the migration
  # history into a throwaway Postgres, then diffs that database against the
  # schema. No shadow database is involved.
  schema-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celluloid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d celluloid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both names point at the service container, so prisma.config.ts resolves
      # to it whatever else is set.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/celluloid
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/celluloid
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exits 1 without writing when `prisma format` would change the file.
      # Prisma 7.10 implements --check but leaves it out of `format --help`.
      - name: Fail if schema.prisma is not formatted
        run: npx prisma format --check

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      # --exit-code: 0 when identical, 2 when they differ, 1 on error. The Tag
      # (userId, lower(name)) index and the nine CHECK constraints exist only in
      # migration SQL. They are not drift: Prisma's schema engine flags
      # expression indexes and CHECK constraints as needing "additional setup"
      # and leaves them out of the comparison, which is also why no migration
      # generated since they were added has tried to drop them.
      - name: Fail on drift between the migrated database and schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # The flip side of the note above: the diff can't see a migration that
      # drops the Tag index or a CHECK, so check those objects directly.
      - name: Fail if the migration-only index or CHECK constraints are missing
        run: node scripts/check-migration-objects.mjs

  # Playwright end-to-end suite (e2e/, playwright.config.ts): a production
  # build served by `next start` on :3100 against a throwaway Postgres, with
  # TMDB replaced by e2e/tmdb-stub.mjs. Placeholder values only; no secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celluloid_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d celluloid_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations (prisma.config.ts) and the suite's server both use the
      # service container.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/celluloid_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/celluloid_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/celluloid_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser, not the system libraries it needs.
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_SITE_URL is compiled into the client, so it must be the
          # suite's origin.
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-a-real-secret-0000
          BETTER_AUTH_URL: http://localhost:3100
          ENCRYPTION_KEY: ci-placeholder-encryption-key-not-real-0000
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          TMDB_ACCESS_TOKEN: ci-placeholder-tmdb-token-not-real-0000

      - name: Run the end-to-end suite
        run: npm run test:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
